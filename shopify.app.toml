# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "70b047c7b1057f7a8ca94c044f6568ae"
name = "importzo"
application_url = "https://importzo.dazzletech.co"
embedded = true

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request" ]
  uri = "/webhooks/customers/data_request"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/redact" ]
  uri = "/webhooks/customers/redact"

  [[webhooks.subscriptions]]
  compliance_topics = [ "shop/redact" ]
  uri = "/webhooks/shop/redact"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# Note: read_collections/write_collections merged into read_products/write_products in 2025-01+
#
# Phase 3 scope audit — every scope below was traced to actual API usage:
#   read_products/write_products      product transfer + CSV import/export
#   read_inventory/write_inventory    inventorySetQuantities, inventoryItem, locations
#   read_themes/write_themes          theme ZIP transfer (themes.json, assets.json)
#   read_files/write_files            fileCreate + files query (media transfer)
#   read_content/write_content        pages, blogs, articles
#   read_online_store_pages           page transfer
#   read_legal_policies               shopPolicies (copied as pages)
#   read_online_store_navigation/write  menu transfer
#   read_customers                    customer CSV export (app.export.jsx) — see note
#
# REMOVED: read_orders. Audited across the whole codebase — no orders,
# draftOrders, or fulfillmentOrder query exists anywhere. It was requested
# and never used, which is exactly what scope minimization is for.
#
# read_customers is genuinely used (customer CSV export), but note it is
# Shopify "protected customer data" and requires separate approval. See
# PROGRESS.md: the published privacy policy says the app does not collect
# customer personal information, which is true (the export streams to the
# merchant's browser and is never persisted) but sits awkwardly next to a
# feature that reads names/emails/phones. Flagged for your review.
#
# Phase 4.2 ADDITION — read_markets: lists the source store's configured
# Markets so a transfer can optionally be scoped to one region and the
# resulting products tagged with it (markets.server.js, api.migration-job.jsx,
# app.transfer.jsx). Query-only (markets/listMarkets), no write mutations are
# ever issued. NOT YET COMMITTED — adding a scope triggers Shopify's
# re-authorization prompt for every existing install, same as the Phase 3.2
# removal but in the other direction (this one asks for MORE access). Held
# for your explicit review before shipping. See PROGRESS.md.
scopes = "read_products,write_products,read_inventory,write_inventory,read_themes,write_themes,read_files,write_files,read_content,write_content,read_online_store_pages,read_legal_policies,read_online_store_navigation,write_online_store_navigation,read_customers,read_markets"

[auth]
redirect_urls = [ "https://importzo.dazzletech.co/auth/callback" ]
