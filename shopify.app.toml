# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "70b047c7b1057f7a8ca94c044f6568ae"
name = "importzo"
application_url = "https://importzo.dazzletech.co"
embedded = true

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request" ]
  uri = "/webhooks/customers/data_request"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/redact" ]
  uri = "/webhooks/customers/redact"

  [[webhooks.subscriptions]]
  compliance_topics = [ "shop/redact" ]
  uri = "/webhooks/shop/redact"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# Note: read_collections/write_collections merged into read_products/write_products in 2025-01+
scopes = "read_products,write_products,read_orders,read_inventory,write_inventory,read_themes,write_themes,read_files,write_files,read_content,write_content,read_online_store_pages,read_legal_policies,read_online_store_navigation,write_online_store_navigation,read_customers"

[auth]
redirect_urls = [ "https://importzo.dazzletech.co/auth/callback" ]
